# Parametres de la marche (hexapod_control/gait_node). Modifiables en marche :
#   ros2 param set /gait_node body_height 0.10     (ou panneau Parameters de Foxglove)
gait_node:
  ros__parameters:
    rate: 50.0            # Hz
    body_height: 0.12     # m : axes des hanches au-dessus du sol (plaque du bas a -18.5 mm)
    min_height: 0.05      # bornes ; la marche limite aussi a ce que les pattes permettent
    max_height: 0.15
    stance_radius: 0.12   # m : ecart pied <-> axe de hanche VOULU ; adapte a la hauteur (butees des
                          #     tibias : 120 mm des 130 mm de haut, 130 a 120, 155 a 90, 175 a 50)
    step_height: 0.03     # m : levee des pattes en vol
    cycle_time: 0.8       # s : un cycle complet (2 pas de trepied) a vitesse max
    max_linear: 0.20      # m/s
    max_angular: 0.8      # rad/s
    step_reach: 0.045     # m : demi-pas max (pas jusqu'a 9 cm) ; plus grand = pieds plus ecartes
    cmd_timeout: 0.5      # s sans /cmd_vel -> arret
    height_gain: 0.04     # t / b : vitesse de la hauteur = linear.z x 0.04 (clavier 0.10 -> 4 mm/s)
    height_rate: 0.01     # m/s : vitesse max de changement de hauteur (rampe, tous moyens confondus)
